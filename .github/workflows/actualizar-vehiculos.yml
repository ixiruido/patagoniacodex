name: Actualizar vehículos

on:
  workflow_dispatch:
    inputs:
      demo_target:
        description: 'Nombre de la subcarpeta de la demo'
        required: true
        default: 'aut'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v5


      # ==========================================
      # 2. DESCARGAR JSON DESDE GOOGLE SHEETS
      # ==========================================

      - name: Descargar JSON desde Google Apps Script
        run: |
          curl -fL \
            --retry 5 \ 
            --retry-delay 5 \ 
            --retry-all-errors \
            "https://script.google.com/macros/s/AKfycbxHILBf5tPgE_fuW16bZ4CisfplPXKES8KwCwJvofOAqs6rUGSO98n1wxLQi_0K2lQv/exec" \
            -o catalogo_nuevo.json


      # ==========================================
      # 3. MOSTRAR RESPUESTA
      # ==========================================

      - name: Mostrar respuesta recibida
        run: |
          echo "Tamaño:"
          wc -c catalogo_nuevo.json

          echo ""

          echo "Primeros 3000 caracteres:"
          head -c 3000 catalogo_nuevo.json

          echo ""


      # ==========================================
      # 4. VALIDAR JSON
      # ==========================================

      - name: Validar JSON
        run: |
          python -m json.tool catalogo_nuevo.json > /dev/null
          echo "JSON válido."


      # ==========================================
      # 5. PREPARAR CARPETAS
      # ==========================================

      - name: Preparar carpetas
        run: |
          TARGET_DIR="demo/${{ github.event.inputs.demo_target }}"
          IMAGE_DIR="$TARGET_DIR/imagenes"

          mkdir -p "$TARGET_DIR"
          mkdir -p "$IMAGE_DIR"

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "IMAGE_DIR=$IMAGE_DIR" >> "$GITHUB_ENV"

          echo "Carpeta destino: $TARGET_DIR"
          echo "Carpeta imágenes: $IMAGE_DIR"


      # ==========================================
      # 6. DESCARGAR IMÁGENES
      # ==========================================

      - name: Descargar imágenes
        run: |
          python << 'PY'
          import json
          import os
          import subprocess
          import sys

          with open(
              "catalogo_nuevo.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          vehiculos = data.get("vehiculos", [])

          image_dir = os.environ["IMAGE_DIR"]

          print(f"Vehículos encontrados: {len(vehiculos)}")

          for vehiculo in vehiculos:

              nombre = str(
                  vehiculo.get("nombre", "")
              )

              fuente = str(
                  vehiculo.get("fotoFuente", "")
              ).strip()

              destino = str(
                  vehiculo.get("foto", "")
              ).strip()

              # ----------------------------------
              # SIN IMAGEN
              # ----------------------------------

              if not fuente or not destino:
                  print(
                      f"Sin imagen: {nombre}"
                  )
                  continue

              # ----------------------------------
              # NOMBRE DEL ARCHIVO
              # ----------------------------------

              archivo = os.path.basename(destino)

              ruta = os.path.join(
                  image_dir,
                  archivo
              )

              print(
                  f"Descargando {archivo} para: {nombre}"
              )

              # ----------------------------------
              # DESCARGAR IMAGEN
              # ----------------------------------

              resultado = subprocess.run(
                  [
                      "curl",
                      "-fL",
                      "--retry",
                      "3",
                      "--retry-delay",
                      "2",
                      "-o",
                      ruta,
                      fuente
                  ],
                  capture_output=True,
                  text=True
              )

              # ----------------------------------
              # COMPROBAR DESCARGA
              # ----------------------------------

              if resultado.returncode != 0:

                  print(
                      f"ERROR descargando {archivo}"
                  )

                  print(
                      resultado.stderr
                  )

                  sys.exit(1)

              # ----------------------------------
              # COMPROBAR ARCHIVO
              # ----------------------------------

              if (
                  not os.path.exists(ruta)
                  or os.path.getsize(ruta) == 0
              ):

                  print(
                      f"ERROR: imagen vacía: {archivo}"
                  )

                  sys.exit(1)

              print(
                  f"OK: {archivo} "
                  f"({os.path.getsize(ruta)} bytes)"
              )

          print("Descarga de imágenes terminada.")

          PY


      # ==========================================
      # 7. PREPARAR JSON FINAL
      # ==========================================

      - name: Preparar JSON final
        run: |
          python << 'PY'
          import json

          archivo = "catalogo_nuevo.json"

          with open(
              archivo,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          for vehiculo in data.get("vehiculos", []):

              # fotoFuente solamente se utiliza
              # durante el workflow para descargar
              # la imagen desde Google.

              vehiculo.pop(
                  "fotoFuente",
                  None
              )

          with open(
              archivo,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "JSON final preparado."
          )

          PY


      # ==========================================
      # 8. ACTUALIZAR CATÁLOGO
      # ==========================================

      - name: Actualizar catálogo
        run: |

          TARGET_FILE="$TARGET_DIR/catalogo.json"

          echo "Procesando:"
          echo "$TARGET_FILE"


          # Si no existe todavía, simplemente lo copiamos.

          if [ ! -f "$TARGET_FILE" ]; then

            echo "El catálogo todavía no existe."

            mv \
              catalogo_nuevo.json \
              "$TARGET_FILE"

          else

            if cmp -s \
              "$TARGET_FILE" \
              "catalogo_nuevo.json"
            then

              echo "El catálogo no cambió."

              rm catalogo_nuevo.json

            else

              echo "El catálogo cambió."

              mv \
                catalogo_nuevo.json \
                "$TARGET_FILE"

            fi

          fi


      # ==========================================
      # 9. ELIMINAR IMÁGENES ANTIGUAS
      # ==========================================

      - name: Eliminar imágenes antiguas
        run: |
          python << 'PY'
          import json
          import os
          import glob

          catalogo = os.path.join(
              os.environ["TARGET_DIR"],
              "catalogo.json"
          )

          image_dir = os.environ["IMAGE_DIR"]

          with open(
              catalogo,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          # --------------------------------------
          # IMÁGENES ACTUALES
          # --------------------------------------

          imagenes_actuales = set()

          for vehiculo in data.get(
              "vehiculos",
              []
          ):

              foto = str(
                  vehiculo.get(
                      "foto",
                      ""
                  )
              ).strip()

              if foto:

                  imagen = os.path.basename(
                      foto
                  )

                  imagenes_actuales.add(
                      imagen
                  )

          print(
              "Imágenes actualmente utilizadas:"
          )

          for imagen in sorted(
              imagenes_actuales
          ):
              print(
                  f"  {imagen}"
              )

          # --------------------------------------
          # IMÁGENES EXISTENTES EN GITHUB
          # --------------------------------------

          existentes = glob.glob(
              os.path.join(
                  image_dir,
                  "vehiculo-F*.jpg"
              )
          )

          print(
              f"Imágenes existentes: {len(existentes)}"
          )

          # --------------------------------------
          # ELIMINAR HUÉRFANAS
          # --------------------------------------

          for archivo in existentes:

              nombre = os.path.basename(
                  archivo
              )

              if nombre not in imagenes_actuales:

                  print(
                      f"Eliminando imagen antigua: "
                      f"{nombre}"
                  )

                  os.remove(
                      archivo
                  )

          print(
              "Limpieza de imágenes terminada."
          )

          PY


      # ==========================================
      # 10. GUARDAR CAMBIOS EN GITHUB
      # ==========================================

      - name: Guardar cambios en GitHub
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # Agregar catálogo e imágenes

          git add \
            "$TARGET_DIR"


          # ----------------------------------------
          # COMPROBAR SI HAY CAMBIOS
          # ----------------------------------------

          if git diff --cached --quiet
          then

            echo "No hay cambios para guardar."

          else

            echo "Hay cambios. Creando commit..."

            git commit \
              -m "Actualizar vehículos e imágenes: ${{ github.event.inputs.demo_target }}"

            git push

            echo "Cambios enviados correctamente."

          fi
