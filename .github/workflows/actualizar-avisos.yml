name: Actualizar avisos

on:
  schedule:
    - cron: "7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Descargar JSON desde Google Apps Script
        run: |
          curl -fL "https://script.google.com/macros/s/AKfycbyufD_-oPGbPuDU6W9h33dfqE7rV5tE3KeVwq695NhZQYAGNolrOR9zSrNXctVoyYl-jQ/exec" -o avisos_nuevo.json

      - name: Mostrar respuesta recibida
        run: |
          echo "Tamaño:"
          wc -c avisos_nuevo.json
          echo ""
          echo "Primeros 2000 caracteres:"
          head -c 2000 avisos_nuevo.json
          echo ""

      - name: Validar JSON
        run: |
          python -m json.tool avisos_nuevo.json > /dev/null
          echo "JSON válido."

      - name: Comparar y actualizar
        run: |
          if cmp -s "demo/regazziharina/avisos.json" "avisos_nuevo.json"; then
            echo "El catálogo no cambió."
            rm avisos_nuevo.json
          else
            echo "El catálogo cambió."
            mv avisos_nuevo.json "demo/regazziharina/avisos.json"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "demo/regazziharina/avisos.json"
            git commit -m "Actualizar avisos"
            git push
          fi
