name: Actualizar propiedades

on:
  workflow_dispatch:
    inputs:
      demo_target:
        description: 'Nombre de la subcarpeta de la demo'
        required: true
        default: 'inm'

permissions:
  contents: write

jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v5


      # ==========================================
      # DESCARGAR JSON DESDE GOOGLE APPS SCRIPT
      # ==========================================

      - name: Descargar JSON desde Google Apps Script
        run: |

          URL="https://script.google.com/macros/s/AKfycbzcXtkgMbeHwEClEnAqi35bPKmA4AvucJKRrUTs-77hR3KZALS1ljP5byFtQG792dbbIA/exec"

          echo "Descargando catálogo..."

          for i in 1 2 3 4 5
          do

            echo "Intento $i..."

            if curl -fL --retry 3 --retry-delay 2 "$URL" -o catalogo_nuevo.json
            then

              echo "Descarga correcta."

              break

            fi

            if [ "$i" -eq 5 ]
            then

              echo "No se pudo descargar el JSON."

              exit 1

            fi

            sleep 3

          done


      # ==========================================
      # MOSTRAR JSON
      # ==========================================

      - name: Mostrar respuesta recibida
        run: |

          echo "Tamaño:"
          wc -c catalogo_nuevo.json

          echo ""

          echo "Primeros 2000 caracteres:"

          head -c 2000 catalogo_nuevo.json

          echo ""


      # ==========================================
      # VALIDAR JSON
      # ==========================================

      - name: Validar JSON
        run: |

          python -m json.tool catalogo_nuevo.json > /dev/null

          echo "JSON válido."


      # ==========================================
      # DESCARGAR IMÁGENES
      # ==========================================

      - name: Descargar imágenes
        env:
          SHEET_URL: "https://script.google.com/macros/s/AKfycbzT4BcKg8xNPhjJOZJbHJJvYPBeDBYxO9VRLSaiAX5uUZ582Q_OJ5V0aH-XvLyDgXDigA/exec"
        run: |

          python << 'PY'

          import json
          import os
          import re
          import subprocess
          import urllib.request

          JSON_FILE = "catalogo_nuevo.json"

          TARGET_DIR = "demo/${{ github.event.inputs.demo_target }}"

          IMAGE_DIR = os.path.join(
              TARGET_DIR,
              "imagenes"
          )

          os.makedirs(
              IMAGE_DIR,
              exist_ok=True
          )


          # ==========================================
          # LEER JSON
          # ==========================================

          with open(
              JSON_FILE,
              "r",
              encoding="utf-8"
          ) as archivo:

              catalogo = json.load(archivo)


          propiedades = catalogo.get(
              "propiedades",
              []
          )


          print(
              "Propiedades encontradas:",
              len(propiedades)
          )


          # ==========================================
          # OBTENER URL TEMPORAL DE GOOGLE
          # ==========================================

          sheet_url = os.environ["SHEET_URL"]


          try:

              with urllib.request.urlopen(
                  sheet_url,
                  timeout=30
              ) as response:

                  sheet_json = json.loads(
                      response.read().decode("utf-8")
                  )

          except Exception as error:

              print(
                  "No se pudo consultar nuevamente Google:",
                  error
              )

              sheet_json = None


          # ==========================================
          # SI EL JSON PRINCIPAL NO TRAE URLS,
          # OBTENEMOS LAS IMÁGENES DESDE SHEETS
          # ==========================================

          # En este sistema el nombre de la imagen
          # depende de la fila:
          #
          # propiedad-2.jpg
          # propiedad-3.jpg
          # propiedad-4.jpg
          #
          # Las imágenes reales se descargan usando
          # las URLs temporales generadas por Sheets.


          if sheet_json:

              propiedades_sheet = sheet_json.get(
                  "propiedades",
                  []
              )

              print(
                  "Propiedades disponibles para imágenes:",
                  len(propiedades_sheet)
              )


          # ==========================================
          # DESCARGAR IMÁGENES
          # ==========================================

          # NOTA:
          #
          # Este bloque busca URLs de imagen que puedan
          # existir en el JSON recibido.
          #
          # Si la imagen no tiene URL descargable,
          # conserva la imagen existente en GitHub.


          for propiedad in propiedades:

              nombre_archivo = propiedad.get(
                  "foto",
                  ""
              )


              if not nombre_archivo:
                  continue


              destino = os.path.join(
                  IMAGE_DIR,
                  nombre_archivo
              )


              # --------------------------------------
              # Buscar URL
              # --------------------------------------

              url = propiedad.get(
                  "fotoUrl",
                  ""
              )


              if not url:

                  url = propiedad.get(
                      "foto",
                      ""
                  )


              # --------------------------------------
              # Si no es URL, no descargar
              # --------------------------------------

              if not isinstance(url, str):

                  continue


              if not url.startswith(
                  "http://"
              ) and not url.startswith(
                  "https://"
              ):

                  continue


              print(
                  "Descargando:",
                  nombre_archivo
              )


              try:

                  urllib.request.urlretrieve(
                      url,
                      destino
                  )

                  print(
                      "OK:",
                      destino
                  )

              except Exception as error:

                  print(
                      "ERROR:",
                      error
                  )


          print(
              "Proceso de imágenes terminado."
          )

          PY


      # ==========================================
      # ACTUALIZAR CATÁLOGO
      # ==========================================

      - name: Actualizar catálogo
        run: |

          TARGET_DIR="demo/${{ github.event.inputs.demo_target }}"

          TARGET_FILE="$TARGET_DIR/catalogo.json"


          echo "Procesando: $TARGET_FILE"


          mkdir -p "$TARGET_DIR"


          if cmp -s "$TARGET_FILE" "catalogo_nuevo.json"
          then

            echo "El catálogo no cambió."

            rm catalogo_nuevo.json

          else

            echo "El catálogo cambió."

            mv catalogo_nuevo.json "$TARGET_FILE"

          fi


      # ==========================================
      # ELIMINAR IMÁGENES QUE YA NO EXISTEN
      # ==========================================

      - name: Limpiar imágenes antiguas
        run: |

          TARGET_DIR="demo/${{ github.event.inputs.demo_target }}"

          IMAGE_DIR="$TARGET_DIR/imagenes"


          if [ ! -d "$IMAGE_DIR" ]
          then

            echo "No existe carpeta de imágenes."

            exit 0

          fi


          python << 'PY'

          import json
          import os
          import glob

          TARGET_DIR = "demo/${{ github.event.inputs.demo_target }}"

          IMAGE_DIR = os.path.join(
              TARGET_DIR,
              "imagenes"
          )

          CATALOG_FILE = os.path.join(
              TARGET_DIR,
              "catalogo.json"
          )


          if not os.path.exists(
              CATALOG_FILE
          ):

              print(
                  "No existe catálogo."
              )

              exit(0)


          with open(
              CATALOG_FILE,
              "r",
              encoding="utf-8"
          ) as archivo:

              catalogo = json.load(
                  archivo
              )


          propiedades = catalogo.get(
              "propiedades",
              []
          )


          imagenes_validas = set()


          for propiedad in propiedades:

              foto = propiedad.get(
                  "foto",
                  ""
              )

              if foto:

                  imagenes_validas.add(
                      foto
                  )


          print(
              "Imágenes válidas:",
              imagenes_validas
          )


          for archivo in glob.glob(
              os.path.join(
                  IMAGE_DIR,
                  "*"
              )
          ):

              nombre = os.path.basename(
                  archivo
              )


              if nombre not in imagenes_validas:

                  print(
                      "Eliminando imagen antigua:",
                      nombre
                  )

                  os.remove(
                      archivo
                  )

          PY


      # ==========================================
      # COMMIT Y PUSH
      # ==========================================

      - name: Guardar cambios en GitHub
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add "$TARGET_DIR"


          if git diff --cached --quiet
          then

            echo "No hay cambios para guardar."

          else

            git commit -m "Actualizar propiedades: ${{ github.event.inputs.demo_target }}"

            git push

          fi
