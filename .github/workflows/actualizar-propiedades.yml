name: Actualizar propiedades

on:

  workflow_dispatch:

    inputs:

      demo_target:
        description: 'Nombre de la subcarpeta de la demo'
        required: true
        default: 'inm'


permissions:

  contents: write


jobs:

  actualizar:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio

        uses: actions/checkout@v5


      # ==========================================
      # DESCARGAR JSON
      # ==========================================

      - name: Descargar JSON desde Google Apps Script

        run: |

          URL="https://script.google.com/macros/s/AKfycbzxOBarAlJ_G4TFpknreYtwDv3RcIKybCIf8UadpipnsrNclSomTlRS1nsZrdLP5IB6vA/exec"

          echo "Descargando catálogo..."

          for i in 1 2 3 4 5
          do

            echo "Intento $i..."

            if curl -fL \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              "$URL" \
              -o catalogo_nuevo.json
            then

              echo "Descarga correcta."

              break

            fi


            if [ "$i" -eq 5 ]
            then

              echo "No se pudo descargar el JSON."

              exit 1

            fi


            sleep 3

          done


      # ==========================================
      # MOSTRAR JSON
      # ==========================================

      - name: Mostrar respuesta recibida

        run: |

          echo "Tamaño:"

          wc -c catalogo_nuevo.json

          echo ""

          echo "Primeros 2000 caracteres:"

          head -c 2000 catalogo_nuevo.json

          echo ""


      # ==========================================
      # VALIDAR JSON
      # ==========================================

      - name: Validar JSON

        run: |

          python -m json.tool \
            catalogo_nuevo.json \
            > /dev/null

          echo "JSON válido."


      # ==========================================
      # DEFINIR CARPETAS
      # ==========================================

      - name: Preparar rutas

        run: |

          echo "TARGET_DIR=demo/${{ github.event.inputs.demo_target }}" >> "$GITHUB_ENV"

          echo "IMAGE_DIR=demo/${{ github.event.inputs.demo_target }}/imagenes" >> "$GITHUB_ENV"

          echo "TARGET_FILE=demo/${{ github.event.inputs.demo_target }}/catalogo.json" >> "$GITHUB_ENV"


      # ==========================================
      # CREAR CARPETAS
      # ==========================================

      - name: Crear carpeta de imágenes

        run: |

          mkdir -p "$IMAGE_DIR"


      # ==========================================
      # DESCARGAR IMÁGENES
      # ==========================================

      - name: Descargar imágenes

        run: |

          python << 'PY'

          import json
          import os
          import urllib.request
          import urllib.error
          import time


          JSON_FILE = "catalogo_nuevo.json"

          IMAGE_DIR = os.environ["IMAGE_DIR"]


          # ==========================================
          # LEER JSON
          # ==========================================

          with open(
              JSON_FILE,
              "r",
              encoding="utf-8"
          ) as archivo:

              catalogo = json.load(
                  archivo
              )


          propiedades = catalogo.get(
              "propiedades",
              []
          )


          print(
              "Propiedades:",
              len(propiedades)
          )


          # ==========================================
          # DESCARGAR CADA IMAGEN
          # ==========================================

          for propiedad in propiedades:

              nombre = propiedad.get(
                  "foto",
                  ""
              )

              url = propiedad.get(
                  "fotoUrl",
                  ""
              )


              if not nombre:

                  continue


              if not url:

                  print(
                      "Sin imagen:",
                      nombre
                  )

                  continue


              destino = os.path.join(
                  IMAGE_DIR,
                  nombre
              )


              print(
                  "Descargando:",
                  nombre
              )


              descargada = False


              # --------------------------------------
              # RETRIES
              # --------------------------------------

              for intento in range(1, 6):

                  try:

                      request = urllib.request.Request(

                          url,

                          headers={
                              "User-Agent":
                                  "Mozilla/5.0"
                          }

                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          contenido = response.read()


                      if not contenido:

                          raise Exception(
                              "Imagen vacía"
                          )


                      with open(
                          destino,
                          "wb"
                      ) as archivo:

                          archivo.write(
                              contenido
                          )


                      print(
                          "OK:",
                          nombre,
                          "(",
                          len(contenido),
                          "bytes)"
                      )


                      descargada = True

                      break


                  except Exception as error:

                      print(
                          "Error intento",
                          intento,
                          "para",
                          nombre,
                          ":",
                          error
                      )


                      if intento < 5:

                          time.sleep(3)


              if not descargada:

                  print(
                      "NO SE PUDO DESCARGAR:",
                      nombre
                  )


          print(
              "Descarga de imágenes terminada."
          )

          PY


      # ==========================================
      # ACTUALIZAR CATÁLOGO
      # ==========================================

      - name: Actualizar catálogo

        run: |

          mkdir -p "$TARGET_DIR"


          mv \
            catalogo_nuevo.json \
            "$TARGET_FILE"


          echo "Catálogo actualizado:"


          ls -lh "$TARGET_FILE"


      # ==========================================
      # LIMPIAR IMÁGENES ANTIGUAS
      # ==========================================

      - name: Limpiar imágenes antiguas

        run: |

          python << 'PY'

          import json
          import os
          import glob


          IMAGE_DIR = os.environ["IMAGE_DIR"]

          TARGET_FILE = os.environ["TARGET_FILE"]


          if not os.path.exists(
              TARGET_FILE
          ):

              print(
                  "No existe el catálogo."
              )

              exit(0)


          with open(
              TARGET_FILE,
              "r",
              encoding="utf-8"
          ) as archivo:

              catalogo = json.load(
                  archivo
              )


          propiedades = catalogo.get(
              "propiedades",
              []
          )


          # ==========================================
          # IMÁGENES QUE DEBERÍAN EXISTIR
          # ==========================================

          imagenes_validas = set()


          for propiedad in propiedades:

              foto = propiedad.get(
                  "foto",
                  ""
              )


              if foto:

                  imagenes_validas.add(
                      foto
                  )


          print(
              "Imágenes válidas:",
              imagenes_validas
          )


          # ==========================================
          # BORRAR SOBRANTES
          # ==========================================

          for archivo in glob.glob(
              os.path.join(
                  IMAGE_DIR,
                  "*"
              )
          ):

              if not os.path.isfile(
                  archivo
              ):

                  continue


              nombre = os.path.basename(archivo)


              if nombre not in imagenes_validas:

                  print(
                      "Eliminando:",
                      nombre
                  )

                  os.remove(
                      archivo
                  )


          PY


      # ==========================================
      # GUARDAR EN GITHUB
      # ==========================================

      - name: Guardar cambios en GitHub

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add "$TARGET_DIR"


          if git diff --cached --quiet
          then

            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Actualizar propiedades: ${{ github.event.inputs.demo_target }}"

            git push

          fi
