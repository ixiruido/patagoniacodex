name: Actualizar productos

on:
  workflow_dispatch:
    inputs:
      demo_target:
        description: 'Nombre de la subcarpeta de la demo'
        required: true
        default: 'cor'

permissions:
  contents: write

jobs:
  actualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v5


      # ==========================================
      # DESCARGAR JSON DESDE GOOGLE SHEETS
      # ==========================================

      - name: Descargar JSON desde Google Apps Script
        run: |

          URL="https://script.google.com/macros/s/AKfycbxF4A5635o4_VrN3_Y5BxCJjgy78LKAAkReTgWDwCcOPcOWeUU16Ca-x5OTPZMaWA/exec"

          echo "Descargando catálogo..."

          for intento in 1 2 3 4 5
          do

            echo "Intento $intento..."

            if curl -fL \
              --connect-timeout 20 \
              --max-time 120 \
              "$URL" \
              -o catalogo_nuevo.json
            then

              echo "Descarga correcta."

              break

            fi

            if [ "$intento" -eq 5 ]; then

              echo "No se pudo descargar el JSON."

              exit 1

            fi

            echo "Esperando 5 segundos..."

            sleep 5

          done


      # ==========================================
      # MOSTRAR RESPUESTA RECIBIDA
      # ==========================================

      - name: Mostrar respuesta recibida
        run: |

          echo "Tamaño:"
          wc -c catalogo_nuevo.json

          echo ""

          echo "Primeros 2000 caracteres:"

          head -c 2000 catalogo_nuevo.json

          echo ""


      # ==========================================
      # VALIDAR JSON
      # ==========================================

      - name: Validar JSON
        run: |

          python -m json.tool \
            catalogo_nuevo.json \
            > /dev/null

          echo "JSON válido."


      # ==========================================
      # DESCARGAR IMÁGENES
      # ==========================================

      - name: Descargar imágenes
        env:
          DEMO_TARGET: ${{ github.event.inputs.demo_target }}

        run: |

          python << 'PY'

          import json
          import os
          import time
          import urllib.request


          # ==========================================
          # CONFIGURACIÓN
          # ==========================================

          JSON_FILE = "catalogo_nuevo.json"

          DEMO = os.environ["DEMO_TARGET"]

          IMAGE_DIR = f"demo/{DEMO}/imagenes"


          # Crear carpeta de imágenes

          os.makedirs(
              IMAGE_DIR,
              exist_ok=True
          )


          # ==========================================
          # LEER JSON
          # ==========================================

          with open(
              JSON_FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          productos = data.get(
              "productos",
              []
          )


          print(
              f"Productos encontrados: {len(productos)}"
          )


          # ==========================================
          # FUNCIÓN: OBTENER EXTENSIÓN
          # ==========================================

          def extension_desde_url(url):

              if not url:
                  return ".jpg"


              url_limpia = url.split("?")[0]


              extension = os.path.splitext(
                  url_limpia
              )[1].lower()


              if extension in [
                  ".jpg",
                  ".jpeg",
                  ".png",
                  ".webp",
                  ".gif"
              ]:

                  return extension


              return ".jpg"


          # ==========================================
          # FUNCIÓN: DESCARGAR IMAGEN
          # ==========================================

          def descargar_imagen(url, destino):

              if not url:
                  return False


              request = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }

              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      contenido = response.read()


                  if not contenido:

                      return False


                  with open(
                      destino,
                      "wb"
                  ) as f:

                      f.write(
                          contenido
                      )


                  return True


              except Exception as error:

                  print(
                      f"Error descargando imagen: {error}"
                  )

                  return False


          # ==========================================
          # ARCHIVOS QUE DEBEN EXISTIR
          # ==========================================

          archivos_actuales = set()


          # ==========================================
          # PROCESAR PRODUCTOS
          # ==========================================

          for indice, producto in enumerate(
              productos,
              start=2
          ):


              foto = producto.get(
                  "foto",
                  ""
              )


              # ------------------------------------------
              # SIN FOTO
              # ------------------------------------------

              if not foto:

                  print(
                      f"Fila {indice}: sin imagen."
                  )

                  producto["foto"] = ""

                  continue


              # ------------------------------------------
              # EXTENSIÓN
              # ------------------------------------------

              extension = extension_desde_url(
                  foto
              )


              # ------------------------------------------
              # NOMBRE DE ARCHIVO
              # ------------------------------------------
              #
              # El nombre depende de la fila:
              #
              # D2 -> fila-2.jpg
              # D3 -> fila-3.jpg
              # D4 -> fila-4.jpg
              #
              # ------------------------------------------

              nombre_archivo = (
                  f"fila-{indice}{extension}"
              )


              archivo = os.path.join(
                  IMAGE_DIR,
                  nombre_archivo
              )


              # ------------------------------------------
              # DESCARGAR
              # ------------------------------------------

              print(
                  f"Fila {indice}: descargando imagen..."
              )


              descargada = False


              for intento in range(
                  1,
                  4
              ):

                  print(
                      f"  Intento {intento}/3"
                  )


                  if descargar_imagen(
                      foto,
                      archivo
                  ):

                      descargada = True

                      break


                  if intento < 3:

                      time.sleep(3)


              # ------------------------------------------
              # ERROR
              # ------------------------------------------

              if not descargada:

                  print(
                      f"  ERROR: no se pudo descargar la imagen de fila {indice}"
                  )

                  # No reemplazamos la URL si falló.
                  # Esto evita perder información.

                  continue


              # ------------------------------------------
              # REGISTRAR ARCHIVO
              # ------------------------------------------

              archivos_actuales.add(
                  nombre_archivo
              )


              # ------------------------------------------
              # REEMPLAZAR URL
              # ------------------------------------------

              producto["foto"] = (
                  f"imagenes/{nombre_archivo}"
              )


              print(
                  f"  OK -> {nombre_archivo}"
              )


          # ==========================================
          # ELIMINAR IMÁGENES ANTIGUAS
          # ==========================================

          print(
              "Comprobando imágenes antiguas..."
          )


          for nombre in os.listdir(
              IMAGE_DIR
          ):

              ruta = os.path.join(
                  IMAGE_DIR,
                  nombre
              )


              if not os.path.isfile(
                  ruta
              ):

                  continue


              if nombre not in archivos_actuales:

                  print(
                      f"Eliminando imagen antigua: {nombre}"
                  )

                  os.remove(
                      ruta
                  )


          # ==========================================
          # GUARDAR JSON FINAL
          # ==========================================

          with open(
              JSON_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "JSON actualizado correctamente."
          )

          PY


      # ==========================================
      # MOSTRAR JSON FINAL
      # ==========================================

      - name: Mostrar JSON final
        run: |

          echo "Primeros 3000 caracteres:"

          head -c 3000 \
            catalogo_nuevo.json

          echo ""


      # ==========================================
      # COMPARAR Y ACTUALIZAR
      # ==========================================

      - name: Comparar y actualizar
        run: |

          TARGET_DIR="demo/${{ github.event.inputs.demo_target }}"

          TARGET_FILE="$TARGET_DIR/catalogo.json"


          echo "Procesando:"
          echo "$TARGET_FILE"


          mkdir -p "$TARGET_DIR"


          # ==========================================
          # COPIAR JSON SI CAMBIÓ
          # ==========================================

          if cmp -s \
            "$TARGET_FILE" \
            "catalogo_nuevo.json"
          then

            echo "El catálogo JSON no cambió."

          else

            echo "El catálogo cambió."

            cp \
              catalogo_nuevo.json \
              "$TARGET_FILE"

          fi


          # ==========================================
          # COMPROBAR CAMBIOS
          # ==========================================

          if git diff --quiet
          then

            echo "No hay cambios para guardar."

            exit 0

          fi


          # ==========================================
          # CONFIGURAR GIT
          # ==========================================

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ==========================================
          # AGREGAR CARPETA COMPLETA
          # ==========================================

          git add \
            "$TARGET_DIR"


          # ==========================================
          # COMMIT
          # ==========================================

          git commit \
            -m "Actualizar productos: ${{ github.event.inputs.demo_target }}"


          # ==========================================
          # PUSH
          # ==========================================

          git push
