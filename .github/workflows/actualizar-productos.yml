name: Actualizar productos

on:
  # Eliminamos el schedule porque ahora Google Sheets se encarga de avisar en tiempo real
  workflow_dispatch:
    inputs:
      # Agregamos esta entrada para recibir la carpeta desde Google Sheets
      demo_target:
        description: 'Nombre de la subcarpeta de la demo'
        required: true
        default: 'cor'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Descargar JSON desde Google Apps Script
        run: |
          curl -fL "https://script.google.com/macros/s/AKfycbz6k18tGwARpwr1DNH8wmNPIuUAfH2rOX7sW3v3Xy0UV5LIiyp_66PVgyxcqLwvXoSk/exec" -o catalogo_nuevo.json

      - name: Mostrar respuesta recibida
        run: |
          echo "Tamaño:"
          wc -c catalogo_nuevo.json
          echo ""
          echo "Primeros 2000 caracteres:"
          head -c 2000 catalogo_nuevo.json
          echo ""

      - name: Validar JSON
        run: |
          python -m json.tool catalogo_nuevo.json > /dev/null
          echo "JSON válido."

      - name: Comparar y actualizar
        run: |
          # 1. Definimos las rutas dinámicas usando la variable que manda Google
          TARGET_DIR="demo/${{ github.event.inputs.demo_target }}"
          TARGET_FILE="$TARGET_DIR/catalogo.json"
          
          echo "Procesando la demo en: $TARGET_FILE"
          
          # Asegura que la carpeta exista (por si creas una demo nueva)
          mkdir -p "$TARGET_DIR"

          # 2. Reemplazamos la ruta fija por la variable $TARGET_FILE
          if cmp -s "$TARGET_FILE" "catalogo_nuevo.json"; then
            echo "El catálogo de ${{ github.event.inputs.demo_target }} no cambió."
            rm catalogo_nuevo.json
          else
            echo "El catálogo cambió."
            mv catalogo_nuevo.json "$TARGET_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$TARGET_FILE"
            git commit -m "Actualizar catalogo: ${{ github.event.inputs.demo_target }}"
            git push
          fi
