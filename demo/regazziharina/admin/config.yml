backend:
  name: github
  repo: <ixiruido>/<patagoniacodex>
  branch: main/demo/regazziharina
  site_domain: patagoniacodex.pages.dev # Tu dominio de Cloudflare Pages
  base_url: https://<TU-WORKER-AUTH>.workers.dev # El mediador de login que veremos en el paso 3
  auth_endpoint: auth

media_folder: "images/catalogo" # Carpeta de tu proyecto donde se guardarán las fotos
public_folder: "/images" # Ruta que usará el HTML para leer las fotos

collections:
  - name: "catalogo"
    label: "Catálogo de Productos"
    folder: "main/demo/regazziharina/" # Carpeta donde tienes tu archivo JSON (ej: data/productos.json)
    extension: "json"
    format: "json"
    create: true # Permite al cliente añadir nuevos productos
    slug: "{{fields.id}}" # Cómo se identificará internamente cada producto
    fields:
      - { label: "ID Único", name: "id", widget: "string" }
      - { label: "Nombre del Producto", name: "title", widget: "string" }
      - { label: "Precio", name: "price", widget: "number", value_type: "float" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Foto del Producto", name: "image", widget: "image" }
