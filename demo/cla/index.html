<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi Curso</title>

<link rel="stylesheet" href="./style.css">
</head>


<body>


  <!-- ===================================
       LOGIN
       =================================== -->

  <section id="login-screen">

    <div class="login-box">

      <h1>Mi Curso</h1>

      <p>
        Ingresá tu email para acceder
        a tus clases.
      </p>


      <input
        type="email"
        id="email"
        placeholder="tu@email.com"
        autocomplete="email"
      >


      <button onclick="ingresar()">
        Ingresar
      </button>


      <div id="login-loading">
        Verificando acceso...
      </div>


      <div id="login-error"></div>

    </div>

  </section>



  <!-- ===================================
       APP
       =================================== -->

  <section id="app">


    <header>

      <h2>
        Plataforma del Curso
      </h2>


      <div class="user-area">

        <span id="user-email"></span>

        <button
          class="logout"
          onclick="cerrarSesion()"
        >
          Salir
        </button>

      </div>

    </header>



    <div class="layout">


      <!-- SIDEBAR -->

      <aside>

        <h3>
          Mis clases
        </h3>

        <div id="lista-clases"></div>

      </aside>



      <!-- CONTENIDO -->

      <main>

        <div
          id="contenido"
          class="contenido"
        >

          <div class="bienvenida">

            <h1>
              ¡Bienvenido!
            </h1>

            <p>
              Seleccioná una clase
              para comenzar.
            </p>

          </div>

        </div>

      </main>


    </div>

  </section>



  <script>


    // =====================================
    // IMPORTANTE
    // PEGAR ACÁ LA URL DE TU API
    // =====================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzkz_o5oeBoLrpHN1dnocXrsGBQKYqVEfBCFMhygazKZlrPPObBv3-FxOCs59NFZbI/exec";


    let clases = [];

    let emailActual = "";



    // =====================================
    // LOGIN
    // =====================================

    async function ingresar() {


      const input =
        document.getElementById("email");


      const email =
        input.value.trim().toLowerCase();


      ocultarError();


      if (!email) {

        mostrarError(
          "Ingresá tu email."
        );

        return;

      }


      if (!validarEmail(email)) {

        mostrarError(
          "Ingresá un email válido."
        );

        return;

      }


      mostrarLoading(true);


      try {


        const url =
          API_URL +
          "?email=" +
          encodeURIComponent(email);


        const respuesta =
          await fetch(url);


        if (!respuesta.ok) {

          throw new Error(
            "Error HTTP " +
            respuesta.status
          );

        }


        const datos =
          await respuesta.json();


        console.log(
          "Respuesta API:",
          datos
        );


        // -------------------------------
        // ERROR DE API
        // -------------------------------

        if (datos.error) {

          mostrarError(
            datos.error
          );

          return;

        }


        // -------------------------------
        // GUARDAR DATOS
        // -------------------------------

        clases =
          datos.clases || [];


        emailActual =
          email;


        if (clases.length === 0) {

          mostrarError(
            "No hay clases disponibles."
          );

          return;

        }


        // -------------------------------
        // ENTRAR A LA APP
        // -------------------------------

        document
          .getElementById("login-screen")
          .style.display = "none";


        document
          .getElementById("app")
          .style.display = "block";


        document
          .getElementById("user-email")
          .textContent = email;


        renderizarClases();


      } catch(error) {


        console.error(error);


        mostrarError(
          "No se pudo conectar con el servidor."
        );


      } finally {

        mostrarLoading(false);

      }

    }



    // =====================================
    // MOSTRAR CLASES
    // =====================================

    function renderizarClases() {


      const lista =
        document.getElementById(
          "lista-clases"
        );


      lista.innerHTML = "";


      clases.forEach(
        (clase, index) => {


          const elemento =
            document.createElement("div");


          elemento.className =
            "clase " +
            (
              clase.acceso
                ? "autorizada"
                : "bloqueada"
            );


          elemento.innerHTML = `

            <span>
              ${escapeHTML(clase.nombre)}
            </span>

            <span>
              ${
                clase.acceso
                  ? "🔓"
                  : "🔒"
              }
            </span>

          `;


          if (clase.acceso) {


            elemento.onclick =
              () => mostrarClase(index);


          } else {


            elemento.onclick =
              () => {

                alert(
                  "No tenés autorización " +
                  "para acceder a esta clase."
                );

              };

          }


          lista.appendChild(elemento);

        }
      );

    }



    // =====================================
    // MOSTRAR UNA CLASE
    // =====================================

    function mostrarClase(index) {


      const clase =
        clases[index];


      if (!clase || !clase.acceso) {

        return;

      }


      // -------------------------------
      // MARCAR CLASE ACTIVA
      // -------------------------------

      document
        .querySelectorAll(".clase")
        .forEach(
          elemento =>
            elemento.classList.remove(
              "activa"
            )
        );


      const elementos =
        document.querySelectorAll(
          ".clase"
        );


      if (elementos[index]) {

        elementos[index]
          .classList.add("activa");

      }


      // -------------------------------
      // CONTENEDOR
      // -------------------------------

      const contenido =
        document.getElementById(
          "contenido"
        );


      // -------------------------------
      // YOUTUBE
      // -------------------------------

      const videoId =
        obtenerYoutubeId(
          clase.video
        );


      let html = `

        <h1 class="clase-titulo">
          ${escapeHTML(clase.nombre)}
        </h1>

      `;


      // -------------------------------
      // COMENTARIO
      // -------------------------------

      if (clase.comentario) {

        html += `

          <div class="comentario">

            ${escapeHTML(
              clase.comentario
            )}

          </div>

        `;

      }


      // -------------------------------
      // VIDEO
      // -------------------------------

      if (videoId) {

        html += `

          <div class="video-container">

            <iframe

              src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}"

              title="${escapeHTML(clase.nombre)}"

              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share
              "

              allowfullscreen>

            </iframe>

          </div>

        `;

      } else {

        html += `

          <div class="sin-contenido">

            Esta clase no tiene
            un video de YouTube.

          </div>

        `;

      }


      // -------------------------------
      // PDF
      // -------------------------------

      if (clase.pdf) {

        html += `

          <a

            href="${escapeAttribute(clase.pdf)}"

            target="_blank"

            rel="noopener noreferrer"

            class="pdf-button">

            📄 Ver material PDF

          </a>

        `;

      }


      contenido.innerHTML =
        html;

    }



    // =====================================
    // OBTENER ID DE YOUTUBE
    // =====================================

    function obtenerYoutubeId(url) {


      if (!url) {

        return "";

      }


      url = String(url).trim();


      try {


        const parsed =
          new URL(url);


        // youtube.com/watch?v=XXXXX

        if (
          parsed.hostname.includes(
            "youtube.com"
          )
          &&
          parsed.searchParams.get("v")
        ) {

          return parsed
            .searchParams
            .get("v");

        }


        // youtu.be/XXXXX

        if (
          parsed.hostname ===
          "youtu.be"
        ) {

          return parsed
            .pathname
            .substring(1);

        }


        // youtube.com/embed/XXXXX

        if (
          parsed.pathname
            .startsWith("/embed/")
        ) {

          return parsed
            .pathname
            .split("/embed/")[1];

        }


        // youtube.com/shorts/XXXXX

        if (
          parsed.pathname
            .startsWith("/shorts/")
        ) {

          return parsed
            .pathname
            .split("/shorts/")[1];

        }


      } catch(error) {

        console.error(
          "URL de YouTube inválida",
          error
        );

      }


      return "";

    }



    // =====================================
    // VALIDAR EMAIL
    // =====================================

    function validarEmail(email) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);

    }



    // =====================================
    // LOGOUT
    // =====================================

    function cerrarSesion() {

      location.reload();

    }



    // =====================================
    // LOADING
    // =====================================

    function mostrarLoading(mostrar) {

      document
        .getElementById(
          "login-loading"
        )
        .style.display =
          mostrar
            ? "block"
            : "none";

    }



    // =====================================
    // ERROR
    // =====================================

    function mostrarError(mensaje) {

      const elemento =
        document.getElementById(
          "login-error"
        );


      elemento.textContent =
        mensaje;


      elemento.style.display =
        "block";

    }



    function ocultarError() {

      document
        .getElementById(
          "login-error"
        )
        .style.display =
          "none";

    }



    // =====================================
    // SEGURIDAD BÁSICA HTML
    // =====================================

    function escapeHTML(text) {

      const div =
        document.createElement("div");


      div.textContent =
        text || "";


      return div.innerHTML;

    }



    function escapeAttribute(text) {

      return String(text || "")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


  </script>


</body>

</html>
