<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catálogo</title>

    <link
        rel="stylesheet"
        href="catalogo.css"
    >

</head>


<body>

    <main
        id="catalogo-app"
        class="catalogo"
    >

        <!-- ENCABEZADO -->

        <header class="catalogo-header">

            <h1>
                Catálogo de productos
            </h1>

            <div class="catalogo-controles">

                <div class="buscador">

                    <span>
                        🔎
                    </span>

                    <input
                        type="search"
                        id="buscador"
                        placeholder="Buscar productos..."
                        autocomplete="off"
                    >

                </div>


                <select
                    id="ordenar"
                    aria-label="Ordenar productos"
                >

                    <option value="orden">
                        Orden del catálogo
                    </option>

                    <option value="precio-asc">
                        Precio: menor a mayor
                    </option>

                    <option value="precio-desc">
                        Precio: mayor a menor
                    </option>

                </select>

            </div>

        </header>


        <!-- CATEGORÍAS -->

        <nav
            id="categorias"
            class="categorias"
            aria-label="Categorías"
        >
        </nav>


        <!-- INFORMACIÓN -->

        <div class="catalogo-info">

            <span id="contador">
                Cargando productos...
            </span>

        </div>


        <!-- PRODUCTOS -->

        <section
            id="productos"
            class="productos"
        >
        </section>


        <!-- SIN RESULTADOS -->

        <div
            id="sinResultados"
            class="sin-resultados oculto"
        >

            <div class="sin-resultados-icono">
                🔎
            </div>

            <h2>
                No encontramos productos
            </h2>

            <p>
                Probá con otro nombre o categoría.
            </p>

        </div>

    </main>


    <script src="app.js"></script>

</body>

</html>
